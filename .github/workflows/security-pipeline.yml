
name: Meridian Expenses Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-checks:
    name: Automated Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install security testing tools
        run: |
          pip install bandit semgrep pip-audit

      - name: Run automated application tests
        env:
          FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
          PYTHONPATH: .
        run: |
          python -m pytest -v

      - name: Run Bandit SAST scan
        run: |
          bandit -r app.py seed.py security_test_vulnerability.py -ll

      - name: Run Semgrep SAST scan
        run: |
          semgrep scan --config p/python --error app.py seed.py

      - name: Run dependency vulnerability scan
        run: |
          pip-audit -r requirements.txt

      - name: Run Gitleaks secret detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
